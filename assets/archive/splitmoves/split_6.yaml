Root: 
TriggerSets:
  - Name: JUMP_Up
    Triggers:
      - Priority: 100
        Events:
          - KeyPress:
                Player: Me
                Key: Up
                States:
                  - Hold
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
        Conditions:
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up]"
                        IgnoredByAI: 1
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Shadow]"
                            IgnoredByAI: 1
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up]"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up(Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Shadow]"
                            IgnoredByAI: 1
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up(Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, TUTORIAL].Value"
                            Value2: "1"
        Actions:
          - Animation:
                Name: Jump_Up
  - Name: FLIP_Front
    Triggers:
      - Templates:
          - TACTICS.APPROACH_AFAR
          - TACTICS_BASE.APPROACH
        Priority: 100
        Events:
          - KeyPress:
                Player: Me
                Key: Up_Forward
                States:
                  - Down
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
        Conditions:
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up_Forward]"
                        IgnoredByAI: 1
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                            IgnoredByAI: 1
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
                            IgnoredByAI: 1
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up_Forward]"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up_Forward(Down|Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up_Forward(Down|Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, TUTORIAL].Value"
                            Value2: "1"
        Actions:
          - Animation:
                Name: Flip_Front
        Tactics:
            MathWeight: 40
            Conditions:
              - Or:
                  - And:
                      - Greater:
                            Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                            Value2: "300"
                      - Not:
                          - Equal:
                                Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                                Value2: "1"
                  - And:
                      - Equal:
                            Value1: "?GetVariable[Me, CHEAT_ATTACKS_DISABLED].Value"
                            Value2: "1"
                      - Not:
                          - Equal:
                                Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                                Value2: "1"
              - Greater:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                    Value2: "100"
  - Name: FLIP_Back
    Triggers:
      - Templates:
          - TACTICS.RETREAT
          - TACTICS_BASE.RETREAT
        Priority: 100
        Events:
          - KeyPress:
                Player: Me
                Key: Up_Back
                States:
                  - Down
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
        Conditions:
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up_Back]"
                        IgnoredByAI: 1
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                            IgnoredByAI: 1
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
                            IgnoredByAI: 1
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up_Back]"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up_Back(Down|Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up_Back(Down|Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, TUTORIAL].Value"
                            Value2: "1"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, TUTORIAL_NO_FLIP_BACK].Value"
                    Value2: "1"
        Actions:
          - Animation:
                Name: Flip_Back
        Tactics:
            MathWeight: 10
            Conditions:
              - Not:
                  - Equal:
                        Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                        Value2: "1"
  - Name: WALL_JUMP
    Triggers:
      - Templates:
          - TACTICS.ESCAPE
          - TACTICS_BASE.ESCAPE
        Priority: 150
        Events:
          - KeyPress:
                Player: Me
                Key: Back
                States:
                  - Down
          - KeyPress:
                Player: Me
                Key: Up_Back
                States:
                  - Down
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
        Conditions:
          - Less:
                Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Me],Wall,Back].X)"
                Value2: "45"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, TUTORIAL].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Back]"
                            IgnoredByAI: 1
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Back]"
                            IgnoredByAI: 1
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
                  - Or:
                      - And:
                          - Equal:
                                Value1: "?Player[Me].KeyPress"
                                Value2: "?CLC_KeyPressConvert[Back(Down)]"
                                IgnoredByAI: 1
                          - Equal:
                                Value1: "?Player[Me].CurrentAnimation"
                                Value2: "STEP_BACK"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Back]"
                            IgnoredByAI: 1
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Back]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Back]"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Back]"
        Actions:
          - Animation:
                Name: Wall_Jump
        Tactics:
            Conditions:
              - Less:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Me],Wall,Back].X)"
                    Value2: "45"
              - LessEqual:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Me],Wall,Back].X)"
                    Value2: "150"
              - LessEqual:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                    Value2: "250"
              - Not:
                  - Equal:
                        Value1: "?Player[Enemy].CurrentInterval"
                        Value2: "Attack"
                  - Equal:
                        Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                        Value2: "1"
            MathWeight: 2000
