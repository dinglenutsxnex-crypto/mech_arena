Root: 
TriggerSets:
  - Name: STANCE_START_BIRTH_Tutorial_NOT_PLAYER
    Triggers:
      - Templates:
          - STANCE.START_BIRTH
        Priority: 10003
        Actions:
          - Animation:
                Name: Stance_Start_Birth_Twohanded_Sword_Tutorial
        Events:
          - Birth:
                Player: Me
  - Name: STANCE_START_ROUND_Tutorial_NOT_PLAYER
    Triggers:
      - Templates:
          - STANCE.START_ROUND_NOT_PLAYER
        Priority: 10003
        Actions:
          - Animation:
                Name: Stance_Start_Round_Twohanded_Sword_Tutorial
        Events:
          - VariableDestruction:
                Player: Me
                Name: START_ROUND_NOT_PLAYER
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "STANCE_START_BIRTH"
  - Name: STANCE_START_IDLE_Tutorial_NOT_PLAYER
    Triggers:
      - Templates:
          - STANCE.START_IDLE
        Priority: 13
        Actions:
          - Animation:
                Name: Stance_Start_Idle_Twohanded_Sword_Tutorial
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_START_ROUND"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_START_IDLE"
Animations:
  - "Animation": Stance_Start_Birth_Twohanded_Sword_Tutorial
    "FileName": twohanded_sword_win_stance_idle.bin
    "Looped": 1
    "EndFrame": 80
    "Groups":
      - STANCE_START_BIRTH
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": foot_l
        "Position":
            "Player": Me
            "Object": Pivot
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Object": Center
  - "Animation": Stance_Start_Round_Twohanded_Sword_Tutorial
    "FileName": twohanded_sword_win_stance_idle.bin
    "EndsStage":
      - RoundStart
    "EndFrame": 40
    "Groups":
      - STANCE_START_ROUND
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": foot_l
        "Position":
            "Player": Me
            "Object": Pivot
    "Intervals":
      - "Name": Blocking
      - "Name": Throwable
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
  - "Animation": Stance_Start_Idle_Twohanded_Sword_Tutorial
    "FileName": twohanded_sword_win_stance_idle.bin
    "Groups":
      - STANCE_START_IDLE
    "RepulsionScale":
        "X": 0.9
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": pelvis
        "Position":
            "Player": Me
            "Object": Pivot
    "Intervals":
      - "Name": Blocking
      - "Name": Throwable
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
