              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "THROW_FALL"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "LOSS"
          - LessEqual:
                Value1: "?Player[Me].Health"
                Value2: "0"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Global, Timeout].Value"
                    Value2: "1"
        Actions:
          - Disarm:
                ApplyTo: Me
          - Animation:
                Name: Stance_Loss
      - Priority: 10500
        Events:
          - PostHit:
                Player: Me
          - AnimationEnd:
                Player: Me
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - Slowdown:
                Player: Me
          - VariableDestruction:
                Player: Me
                Name: InPhysics
          - StageChange:
                Stage: RoundFightEnd
        Conditions:
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "Stance_Loss"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "LOSS"
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "THROW_FALL"
          - Equal:
                Value1: "?GetVariable[Enemy, Winner].Value"
                Value2: "1"
          - LessEqual:
                Value1: "?Player[Me].Health"
                Value2: "0"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Global, Timeout].Value"
                    Value2: "1"
        Actions:
          - Disarm:
                ApplyTo: Me
  - Name: LOSS_ON_BACK
