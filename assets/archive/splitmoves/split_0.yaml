              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "LOW_STANCE_LOOP"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, TUTORIAL_NO_ROLL_BACK].Value"
