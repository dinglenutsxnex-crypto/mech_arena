Root: 
TriggerSets:
  - Name: STANCE_IDLE_Common
    Triggers:
      - Templates:
          - STANCE.IDLE
          - STATE.ALIVE
        Priority: 0
        Actions:
          - Animation:
                Name: Stance_Idle
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Not:
              - Equal:
                    Value1: "?Fight[].CurrentStage"
                    Value2: "RoundFightEnd"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_START_ROUND"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_START_IDLE"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
  - Name: STANCE_START_IDLE_Common
    Triggers:
      - Templates:
          - STANCE.START_IDLE
        Priority: 11
        Actions:
          - Animation:
                Name: Stance_Start_Idle
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_START_ROUND"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_START_IDLE"
  - Name: STANCE_WIN_ROUND_Common
    Triggers:
      - Templates:
          - STANCE.WIN_ROUND
          - STATE.ALIVE
        Priority: 10490
        Actions:
          - Animation:
                Name: Stance_Win
        Events:
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - AnimationEnd:
                Player: Me
          - EveryFrame:
                Step: 10
        Conditions:
          - Or:
              - And:
                  - Equal:
                        Value1: "?Fight[].CurrentStage"
                        Value2: "RoundFightEnd"
                  - Equal:
                        Value1: "?GetVariable[Me, Winner].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_WIN_POSE"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_WIN_IDLE"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "Stance_Timeout"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STAND_UP_KICK"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "FOLLOWED_BY"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "EveryFrame"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "EveryFrame"
                  - Equal:
                        Value1: "?Fight[].CurrentStage"
                        Value2: "RoundFightEnd"
                  - Equal:
                        Value1: "?GetVariable[Me, Winner].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_WIN_POSE"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_WIN_IDLE"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "Stance_Timeout"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STAND_UP_KICK"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "FOLLOWED_BY"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
