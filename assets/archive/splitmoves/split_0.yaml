  - Name: LOW_STANCE_COMMON
    Triggers:
      - Templates:
          - LOW_STANCE.IN
        Priority: 205
        Actions:
          - Animation:
                Name: Low_Stance_In
        Events:
          - KeyPress:
                Player: Me
                Key: Down
                States:
                  - Down
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - AnimationEnd:
                Player: Me
          - StageChange:
                Stage: RoundFightStart
        Conditions:
          - Equal:
                Value1: "?Player[Me].KeyPress"
                Value2: "?CLC_KeyPressConvert[Down]"
          - Or:
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "KeyPress"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "LOW_STANCE_OUT"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "AnimationEnd"
                  - Equal:
                        Value1: "?Player[Me].CurrentAnimation"
                        Value2: "LOW_STANCE_OUT"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Down(Down|Hold)]"
                  - Not:
                      - Equal:
