  - Name: COMBO_COUNTER
    Triggers:
      - Priority: 9000
        Events:
          - Hit:
                Player: Enemy
        Conditions:
          - Not:
              - Equal:
                    Value1: "?GetVariable[Enemy, BLOCK].Value"
                    Value2: "1"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "RANGED"
              - Equal:
                    Value1: "?Hit[].Name"
                    Value2: "Hit_No_Combo_Count"
        Actions:
          - SetVariable:
                Name: COMBO_COUNTER
                Value: "?GetVariable[Me, COMBO_COUNTER].Value + 1"
                ApplyTo: Me
                Frames: 90
      - Events:
          - Hit:
                Player: Me
        Conditions:
          - Greater:
                Value1: "?GetVariable[Me, COMBO_COUNTER].Value"
                Value2: "0"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, PERK_PARRY].Value"
                    Value2: "1"
        Actions:
          - SetVariable:
                Name: COMBO_COUNTER
                Value: "0"
                ApplyTo: Me
          - DestroyEffect:
                Name: GUIEffect_Combo
                ApplyTo: Me
          - DestroyEffect:
                Name: GUIEffect_Combo_Counter
                ApplyTo: Me
      - Priority: -9999
        Events:
          - PostHit:
                Player: Enemy
        Conditions:
          - GreaterEqual:
                Value1: "?GetVariable[Me, COMBO_COUNTER].Value"
                Value2: "3"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Enemy, BLOCK].Value"
                    Value2: "1"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "RANGED"
        Actions:
          - DestroyEffect:
                Name: GUIEffect_Combo
                ApplyTo: Me
          - DestroyEffect:
                Name: GUIEffect_Combo_Counter
                ApplyTo: Me
          - GUIEffect:
                Name: GUIEffect_Combo
                ApplyTo: Me
                PoolQuantity: 1
                SingleInstance: 1
          - GUIEffect:
                Name: GUIEffect_Combo_Counter
                ApplyTo: Me
                Text:
                    Alias: substitution
                    Value1: "?GetVariable[Me, COMBO_COUNTER].Value"
                PoolQuantity: 1
                SingleInstance: 1
  - Name: Set_Hit_Critical
    Triggers:
      - Priority: 9999
        Events:
          - Hit:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?Hit[].Critical"
                Value2: "1"
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentInterval"
                    Value2: "Blocking"
              - Equal:
                    Value1: "?Player[Enemy].CurrentAnimation"
                    Value2: "SHADOW_MOVE"
              - Equal:
                    Value1: "?Hit[].Name"
                    Value2: "Hit_No_Critical"
        Actions:
          - SetVariable:
                Name: CRITICAL
                Value: 1
                ApplyTo: Me
                Frames: 1
  - Name: Set_Hit_Block
    Triggers:
      - Priority: 9999
        Events:
          - Hit:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentInterval"
                Value2: "Blocking"
          - Not:
              - Equal:
                    Value1: "?Hit[].Name"
                    Value2: "Unblockable"
              - Equal:
                    Value1: "?GetVariable[Me, PERK_INTERFERENCE_MOD].Value"
                    Value2: "1"
        Actions:
          - SetVariable:
                Name: BLOCK
                Value: 1
                ApplyTo: Me
                Frames: 1
  - Name: Hit_Critical_DM
    Triggers:
      - Events:
          - Hit:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?GetVariable[Me, CRITICAL].Value"
                Value2: "1"
        Actions:
          - SetVariable:
                Name: CRITICAL_FACTOR
                Value: 0.75
                ApplyTo: Enemy
                Frames: 1
          - SetAttribute:
                Name: Factor_UnarmedDamage
                Value: "1 + ?GetVariable[Enemy, CRITICAL_FACTOR].Value"
                ApplyTo: Enemy
          - SetAttribute:
                Name: Factor_WeaponDamage
                Value: "1 + ?GetVariable[Enemy, CRITICAL_FACTOR].Value"
                ApplyTo: Enemy
  - Name: Hit_Block_DM
    Triggers:
      - Events:
          - Hit:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?GetVariable[Me, BLOCK].Value"
                Value2: "1"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, BLOCK_BROKEN].Value"
                    Value2: "1"
        Actions:
          - SetVariable:
                Name: BLOCK_FACTOR
                Value: -0.8
                ApplyTo: Enemy
                Frames: 1
          - SetAttribute:
                Name: Factor_UnarmedDamage
                Value: "1 + ?GetVariable[Enemy, BLOCK_FACTOR].Value"
                ApplyTo: Enemy
          - SetAttribute:
                Name: Factor_WeaponDamage
                Value: "1 + ?GetVariable[Enemy, BLOCK_FACTOR].Value"
                ApplyTo: Enemy
