          - LOW_STANCE.LOOP
        Priority: 205
        Actions:
          - Animation:
                Name: Low_Stance_Idle
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?Player[Me].KeyPress"
                Value2: "?CLC_KeyPressConvert[Down(Hold)]"
          - Not:
              - Equal:
                    Value1: "?Module[].CurrentModule"
                    Value2: "Inventory"
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "LOW_STANCE_IN"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "LOW_STANCE_LOOP"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "LOW_STANCE_DODGE"
      - Templates:
