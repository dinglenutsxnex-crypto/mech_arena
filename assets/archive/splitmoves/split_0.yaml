          - KeyPress:
                Player: Me
                Key: Down
                States:
                  - Unhold
          - AnimationEnd:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?Player[Me].KeyPress"
                Value2: "?CLC_KeyPressConvert[Down]"
          - Not:
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Down(Hold)]"
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "LOW_STANCE_IN"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "LOW_STANCE_LOOP"
              - Equal:
