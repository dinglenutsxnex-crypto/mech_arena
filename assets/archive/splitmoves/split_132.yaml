Root: 
TriggerSets:
  - Name: Shadow_Agile_Helmet
    Triggers:
      - Templates:
          - SHADOW_KEY.UP
          - STATE.SHADOW_FORM
          - TACTICS.SHADOW_ATTACK
          - TACTICS_BASE.SHADOW_MOVE
        Conditions:
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, Shadow_Agile_Helmet_CD].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "AnimationEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                        IgnoredByAI: 1
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Up(Down|Hold)]"
                        IgnoredByAI: 1
                  - Or:
                      - And:
                          - Equal:
                                Value1: "?Player[Me].KeyPress"
                                Value2: "?CLC_KeyPressConvert[Shadow(Down|Hold)]"
                                IgnoredByAI: 1
                          - Not:
                              - Equal:
                                    Value1: "?Player[Me].CurrentInterval"
                                    Value2: "Uninterrupt"
                      - And:
                          - Equal:
                                Value1: "?Player[Me].CurrentAnimation"
                                Value2: "JUMP_UP"
                          - Equal:
                                Value1: "?Player[Me].CurrentInterval"
                                Value2: "Transitional"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Back]"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Back]"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, TUTORIAL].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "AnimationEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up(Down|Hold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Back(Down|Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up(Up|Unhold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "FOLLOWED_BY"
          - Equal:
                Value1: "?Player[Me].ShadowForm"
                Value2: "1"
        Actions:
          - Animation:
                Name: Shadow_Agile_Helmet
          - SetVariable:
                Name: Shadow_Agile_Helmet_CD
                Value: 1
                ApplyTo: Me
                Frames: 400
          - SetVariable:
                Name: SF_CD_HELM
                Value: 1
                ApplyTo: Me
                Frames: 400
          - ShowSFIcon:
                ApplyTo: Me
                Name: Shadow_Agile_Helmet_CD
                Frames: 400
                Equipment: Helmet
          - PlaySound:
                Sounds:
                  - shadow_moves/2h_slash/shadow_slash_wave_2_short
        Priority: 300
        Events:
          - KeyPress:
                Player: Me
                Key: Shadow
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Up
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Up_Back
                States:
                  - Down
                  - Hold
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
          - AnimationEnd:
                Player: Me
        Tactics:
            MathWeight: 1800
            Conditions:
              - Equal:
                    Value1: "?Player[Me].ShadowForm"
                    Value2: "1"
              - Not:
                  - Equal:
                        Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, CHEAT_ATTACKS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_ARMOR].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_WEAPON].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_HELM].Value"
                        Value2: "1"
              - Equal:
                    Value1: "?Player[Me].ShadowForm"
                    Value2: "1"
Animations:
  - "Animation": Shadow_Agile_Helmet
    "FileName": s_agl_helm.bin
    "Groups":
      - ATTACK
      - SHADOW_MOVE
      - SHADOW_MOVE_END
    "WeaponSwitchFrames":
      - "Name": Main
        "Frame": 1
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": foot_l
        "Position":
            "Player": Me
            "Object": Pivot
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
    "Intervals":
      - "Name": Uninterrupt
        "End": 66
      - "Name": Shadow_Move_Successful
        "Start": 56
        "End": 56
      - "Name": DissolveWeapon
        "End": 56
      - "Name": Shadow_Agile_Helmet_Model_Creation
        "Start": 7
        "End": 7
      - "Name": Throwable
        "Start": 53
      - "Name": Blocking
        "Start": 59
    "Sounds":
      - "Gender":
            "Male":
              - voice/attack/heavy/m/m_heavy_attack_1
              - voice/attack/heavy/m/m_heavy_attack_4
              - voice/attack/heavy/m/m_heavy_attack_5
              - voice/attack/heavy/m/m_heavy_attack_6
              - voice/attack/heavy/m/m_heavy_attack_7
            "Female":
              - voice/attack/heavy/f/f_heavy_attack_1
              - voice/attack/heavy/f/f_heavy_attack_2
              - voice/attack/heavy/f/f_heavy_attack_3
              - voice/attack/heavy/f/f_heavy_attack_4
              - voice/attack/heavy/f/f_heavy_attack_5
        "Frame": 16
...
