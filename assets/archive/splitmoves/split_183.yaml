Root: 
TriggerSets:
  - Name: REACTION__Block_Overhead_Katana
    Triggers:
      - Templates:
          - REACTION.BLOCK_IN
        Priority: 100
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Block[].BlockName"
                    Value2: "Block_Overhead"
              - Equal:
                    Value1: "?Block[].BlockName"
                    Value2: "Block_Overhead_Short"
              - Equal:
                    Value1: "?Block[].BlockName"
                    Value2: "Block_Overhead_Heavy"
          - Equal:
                Value1: "?Player[Me].CurrentInterval"
                Value2: "Blocking"
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentInterval"
                    Value2: "Dodging"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STEP"
              - Equal:
                    Value1: "?Player[Me].CurrentInterval"
                    Value2: "Invincible"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "BLOCK"
              - Equal:
                    Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                    Value2: "1"
        Actions:
          - Animation:
                Name: Block_Overhead_Katana_InOut
        Events:
          - BlockCheck:
                Player: Me
      - Templates:
          - REACTION.BLOCK_HIT
        Priority: 1200
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Block[].BlockName"
                    Value2: "Block_Overhead"
              - Equal:
                    Value1: "?Block[].BlockName"
                    Value2: "Block_Overhead_Short"
              - Equal:
                    Value1: "?Block[].BlockName"
                    Value2: "Block_Overhead_Heavy"
          - Equal:
                Value1: "?GetVariable[Me, BLOCK].Value"
                Value2: "1"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                    Value2: "1"
        Actions:
          - Animation:
                Name: Block_Overhead_Katana_Hit
        Events:
          - PostHit:
                Player: Me
