                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, CHEAT_ATTACKS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, GIZMO_THROW_Active_CD].Value"
                        Value2: "1"
      - Templates:
          - REACTION.HIT_TO_ENEMY
        Conditions:
          - Equal:
                Value1: "?Hit[].Name"
                Value2: "Gizmo_Throw_Start"
          - Greater:
                Value1: "?Player[Enemy].Health"
                Value2: "0"
