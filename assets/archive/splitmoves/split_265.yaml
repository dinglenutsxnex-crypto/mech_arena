                      - Equal:
                            Value1: "?GetVariable[Enemy, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentInterval"
