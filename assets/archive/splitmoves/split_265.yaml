Root: 
TriggerSets:
  - Name: GIZMO_THROW_Active
    Triggers:
      - Templates:
          - ATTACK.BASIC
          - TACTICS.GIZMO_THROW
        Priority: 301
        Conditions:
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, GIZMO_THROW_Active_CD].Value"
                    Value2: "1"
          - LessEqual:
                Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                Value2: "155"
          - Not:
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Back(Down|Hold)]"
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Forward(Down|Hold)]"
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Up(Down|Hold)]"
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Down(Down|Hold)]"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "StageChange"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Punch(Down|Up)]"
                        IgnoredByAI: 1
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Punch(Up|Unhold)]"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Punch(Up|Unhold)]"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, TUTORIAL].Value"
                            Value2: "1"
        Actions:
          - Animation:
                Name: Gizmo_Throw_Active_Start
          - SetVariable:
                Name: GIZMO_THROW_Active_CD
                Value: 1
                ApplyTo: Me
                Frames: 50
        Events:
          - KeyPress:
                Player: Me
                Key: Punch
                States:
                  - Up
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
        Tactics:
            MathWeight: 9999
            Conditions:
              - LessEqual:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                    Value2: "135"
