          - ATTACK.BASIC
          - TACTICS.ATTACK_MIDRANGE
          - TACTICS_BASE.ATTACK
        Actions:
          - Animation:
                Name: Sword_Lonely_Slash
        Priority: 200
        Events:
          - KeyPress:
