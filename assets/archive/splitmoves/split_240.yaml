Root: 
TriggerSets:
  - Name: STANCE_START_IDLE_Tutorial
    Triggers:
      - Templates:
          - STANCE.START_IDLE
        Priority: 13
        Actions:
          - Animation:
                Name: Stance_Start_Idle_Tutorial
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_START_ROUND"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_START_IDLE"
  - Name: STANCE_START_ROUND_Strong_Fists_Tutorial
    Triggers:
      - Templates:
          - STANCE.START_ROUND_PLAYER
        Priority: 10003
        Actions:
          - Animation:
                Name: Stance_Start_Birth_Tutorial_2
          - SetVariable:
                Name: START_ROUND_NOT_PLAYER
                Value: 1
                ApplyTo: Enemy
                Frames: 20
        Events:
          - StageChange:
                Stage: RoundStart
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "STANCE_START_BIRTH"
  - Name: STANCE_START_ROUND_Strong_Fists_Tutorial_2
    Triggers:
      - Priority: 10003
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "Stance_Start_Birth_Tutorial_2"
        Actions:
          - Animation:
                Name: Stance_Start_Round_Tutorial
Animations:
  - "Animation": Stance_Start_Idle_Tutorial
    "FileName": m_str_stance_idle.bin
    "Groups":
      - STANCE_START_IDLE
    "RepulsionScale":
        "X": 0.7
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": pelvis
        "Position":
            "Player": Me
            "Object": Pivot
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
    "Intervals":
      - "Name": Blocking
      - "Name": Throwable
  - "Animation": Stance_Start_Birth_Tutorial_2
    "FileName": m_str_stance_birth.bin
    "EndFrame": 70
    "Groups":
      - STANCE_START_BIRTH
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": foot_l
        "Position":
            "Player": Me
            "Object": Pivot
    "Intervals":
      - "Name": show_tutorial_dialog
        "Start": 40
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Object": Center
  - "Animation": Stance_Start_Round_Tutorial
    "FileName": m_str_stance.bin
    "EndsStage":
      - RoundStart
    "Groups":
      - STANCE_START_ROUND
    "RepulsionScale":
        "X": 0.5
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": foot_l
        "Position":
            "Player": Me
            "Object": Pivot
    "Sounds":
      - "Common":
          - whoosh/fists/light/7_Hand_Whooshes_V1_bip
          - whoosh/fists/light/7_Hand_Whooshes_V4_bip
          - whoosh/fists/light/7_Hand_Whooshes_V14_bip
          - whoosh/fists/light/7_Hand_Whooshes_V30_bip
        "Frame": 16
...
