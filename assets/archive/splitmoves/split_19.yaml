Root: 
TriggerSets:
  - Name: STANCE_START_IDLE_Agile_Fists
    Triggers:
      - Templates:
          - STANCE.START_IDLE
        Actions:
          - Animation:
                Name: Stance_Start_Idle_Agile_Fists
        Priority: 12
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_START_ROUND"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_START_IDLE"
  - Name: STANCE_WIN_ROUND_Agile_Fists
    Triggers:
      - Templates:
          - STANCE.WIN_ROUND
          - STATE.ALIVE
        Priority: 10491
        Actions:
          - Animation:
                Name: Stance_Win_Agile_Fists
        Events:
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - AnimationEnd:
                Player: Me
          - EveryFrame:
                Step: 10
        Conditions:
          - Or:
              - And:
                  - Equal:
                        Value1: "?Fight[].CurrentStage"
                        Value2: "RoundFightEnd"
                  - Equal:
                        Value1: "?GetVariable[Me, Winner].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_WIN_POSE"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_WIN_IDLE"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "Stance_Timeout"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STAND_UP_KICK"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "FOLLOWED_BY"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "EveryFrame"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "EveryFrame"
                  - Equal:
                        Value1: "?Fight[].CurrentStage"
                        Value2: "RoundFightEnd"
                  - Equal:
                        Value1: "?GetVariable[Me, Winner].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_WIN_POSE"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_WIN_IDLE"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "Stance_Timeout"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STAND_UP_KICK"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "FOLLOWED_BY"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
  - Name: STANCE_FINISHING_ROUND_IDLE_Agile_Fists
    Triggers:
      - Templates:
          - STANCE.FINISHING_ROUND_IDLE
          - STATE.ALIVE
        Priority: 9391
        Actions:
          - Animation:
                Name: Stance_Win_Idle_Agile_Fists
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Fight[].CurrentStage"
                    Value2: "RoundFightEnd"
              - Equal:
                    Value1: "?Fight[].CurrentStage"
                    Value2: "RoundEnd"
              - Equal:
                    Value1: "?Fight[].CurrentStage"
                    Value2: "FightEnd"
              - Equal:
                    Value1: "?Fight[].CurrentStage"
                    Value2: "RoundStart"
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_WIN_POSE"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_WIN_IDLE"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
Animations:
