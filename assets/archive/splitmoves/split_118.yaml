Root: 
TriggerSets:
  - Name: Shadow_Uppercut_Reaction
    Triggers:
      - Templates:
          - REACTION.HIT
        Priority: 1101
        Conditions:
          - Equal:
                Value1: "?Hit[].Name"
                Value2: "Hit_Shadow_Uppercut"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?GetVariable[Me, CRITICAL].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Me, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, PERK_ROCK_NO_FALL].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Me, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?Hit[].Name"
                        Value2: "Hit_No_Critical_Reaction"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
        Actions:
          - Animation:
                Name: Physics
          - SetVariable:
                Name: InPhysics
                Value: 1
                ApplyTo: Me
                Frames: 200
        Events:
          - PostHit:
                Player: Me
      - Templates:
          - REACTION.HIT_ROLL
        Priority: 1101
        Conditions:
          - Equal:
                Value1: "?Hit[].Name"
                Value2: "Hit_Shadow_Uppercut"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, BLOCK].Value"
                    Value2: "1"
              - Equal:
                    Value1: "?GetVariable[Me, CRITICAL].Value"
                    Value2: "1"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "THROW_FALL"
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "FALL_CRITICAL"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STAND_UP_KICK"
              - And:
                  - Equal:
                        Value1: "?Player[Me].CurrentAnimation"
                        Value2: "STAND_UP"
                  - Equal:
                        Value1: "?Player[Me].CurrentInterval"
                        Value2: "Unstable"
              - And:
                  - Equal:
                        Value1: "?Player[Me].CurrentAnimation"
                        Value2: "FALL"
                  - Equal:
                        Value1: "?Player[Me].CurrentInterval"
                        Value2: "Unstable"
        Actions:
          - Animation:
                Name: Physics
          - SetVariable:
                Name: InPhysics
                Value: 1
                ApplyTo: Me
                Frames: 200
        Events:
          - PostHit:
                Player: Me
Animations:
  - "Animation": Physics
    "Groups":
      - PHYSICS
    "Intervals":
      - "Name": Uninterrupt
      - "Name": Unstable
...
