Root: 
TriggerSets:
  - Name: PERK_SPURT
    Triggers:
      - Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "JUMP"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "DASH_DODGE"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "ROLL"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "DASH"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
        Actions:
          - SetShadowCharge:
                Value: "?GetShadowCharge[Me] + ?GetPerkVariable[Me, 1020, ShadowChargeValue]"
          - ShowStatusIcon:
                ApplyTo: Me
                Name: ICON_PERK_SPURT
                BackgroundColor: "#2f4668"
                Icon: ICON_PERK_SPURT
                Frames: 90
                ShowExpiration: 0
                Stackable: 0
        Templates:
          - STATE.ALIVE
...
