Root: 
TriggerSets:
  - Name: ShadowForm_Toggle_Off
    Triggers:
      - Priority: 500
        Events:
          - ShadowChargeBurndown:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?Player[Me].ShadowForm"
                Value2: "1"
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "SHADOW_MOVE"
              - Equal:
                    Value1: "?GetVariable[Me, TestShadowForm].Value"
                    Value2: "1"
        Actions:
          - ToggleShadowForm:
                Value: 0
          - DestroyEffect:
                Name: shadow_fire
                ApplyTo: Me
          - PlaySound:
                Sounds:
                  - shadow_form/shadow end
          - SetVariable:
