Root: 
TriggerSets:
  - Name: PERK_REPELLER
    Triggers:
      - Events:
          - PostHit:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?GetVariable[Me, BLOCK].Value"
                Value2: "1"
          - LessEqual:
                Value1: "?Random[1,100]"
                Value2: "?GetPerkVariable[Me, 1009, Chance]"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
        Actions:
          - ShowStatusIcon:
                ApplyTo: Me
                Name: ICON_PERK_REPELLER
                BackgroundColor: "#2f4668"
                Icon: ICON_PERK_REPELLER
                Frames: "?GetPerkVariable[Me, 1009, Duration]"
                ShowExpiration: 1
                Stackable: 0
          - SetVariable:
                Name: PERK_REPELLER
                Frames: "?GetPerkVariable[Me, 1009, Duration]"
                Value: 1
                ApplyTo: Me
        Templates:
          - STATE.ALIVE
      - Events:
          - Hit:
                Player: Enemy
        Conditions:
          - Equal:
                Value1: "?GetVariable[Me, PERK_REPELLER].Value"
                Value2: "1"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Enemy, BLOCK].Value"
                    Value2: "1"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
        Actions:
          - SetAttribute:
                Name: Factor_UnarmedDamage
                Value: "?GetPerkVariable[Me, 1009, AdditionDamage]"
                ApplyTo: Me
          - SetAttribute:
                Name: Factor_WeaponDamage
                Value: "?GetPerkVariable[Me, 1009, AdditionDamage]"
                ApplyTo: Me
        Templates:
          - STATE.ALIVE
...
