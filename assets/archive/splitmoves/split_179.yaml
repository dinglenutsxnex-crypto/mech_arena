          - REACTION.HIT
        Priority: 1101
        Conditions:
          - Equal:
                Value1: "?Hit[].Name"
                Value2: "Hit_Stomach_Critical_Fall"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?GetVariable[Me, CRITICAL].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Me, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, PERK_ROCK_NO_FALL].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Me, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?Hit[].Name"
                        Value2: "Hit_No_Critical_Reaction"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
        Actions:
          - Animation:
                Name: Hit_Stomach_Critical_Fall
        Events:
          - PostHit:
                Player: Me
