Root: 
TriggerSets:
  - Name: Shadow_Sabers_Throw_Reaction
    Triggers:
      - Templates:
          - REACTION.HIT
        Priority: 1101
        Conditions:
          - Equal:
                Value1: "?Hit[].Name"
                Value2: "Hit_Shadow_Sabers_Throw_Start"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?GetVariable[Me, CRITICAL].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Me, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, PERK_ROCK_NO_FALL].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Me, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?Hit[].Name"
                        Value2: "Hit_No_Critical_Reaction"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
        Actions:
          - Animation:
                Name: Shadow_Sabers_Throw_Passive_Start
        Events:
          - PostHit:
                Player: Me
      - Priority: 400
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "Shadow_Sabers_Throw_Passive_Start"
        Actions:
          - Animation:
                Name: Shadow_Sabers_Throw_Passive_End
Animations:
  - "Animation": Shadow_Sabers_Throw_Passive_Start
    "FileName": s_dual_sabers_passive_start.bin
    "Groups":
      - SHADOW_MOVE_PASSIVE
      - FOLLOWED_BY
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": pelvis
        "Position":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
    "Intervals":
      - "Name": Uninterrupt
  - "Animation": Shadow_Sabers_Throw_Passive_End
    "FileName": s_dual_sabers_passive_end.bin
    "Groups":
      - SHADOW_MOVE_PASSIVE
      - FALL
      - FALL_CRITICAL_ON_FACE
      - FOLLOWED_BY
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": pelvis
        "Position":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
    "Intervals":
      - "Name": Uninterrupt
      - "Name": Floorfall
        "Start": 20
        "End": 20
...
