Root: 
TriggerSets:
  - Name: SFX__Strike_Unarmed
    Triggers:
      - Events:
          - Strike:
                Player: Me
        Conditions:
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "HEAVY"
          - Or:
              - Equal:
                    Value1: "?Strike[].Material"
                    Value2: "flesh"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "UNARMED"
