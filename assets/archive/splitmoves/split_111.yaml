                Key: Shadow
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Down
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Down_Back
                States:
                  - Down
                  - Hold
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
          - AnimationEnd:
                Player: Me
        Tactics:
            MathWeight: 1800
            Conditions:
