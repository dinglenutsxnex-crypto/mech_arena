                Value2: "1"
        Actions:
          - Animation:
                Name: Shadow_Strong_Armor
          - SetVariable:
                Name: Shadow_Strong_Armor_CD
                Value: 1
                ApplyTo: Me
                Frames: 400
          - SetVariable:
                Name: SF_CD_ARMOR
                Value: 1
                ApplyTo: Me
                Frames: 400
          - ShowSFIcon:
                ApplyTo: Me
                Name: Shadow_Strong_Armor_CD
                Frames: 400
