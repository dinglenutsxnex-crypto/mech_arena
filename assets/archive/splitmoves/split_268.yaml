Root: 
TriggerSets:
  - Name: SARGE_WALK
    Triggers:
      - Events:
          - Birth:
                Player: Me
        Actions:
          - SetVariable:
                Name: UNSHOCKABLE
                Value: 1
                ApplyTo: Me
      - Events:
          - Birth:
                Player: Me
        Conditions:
          - GreaterEqual:
                Value1: "?Fight[].Round"
                Value2: "2"
        Actions:
          - SetVariable:
                Name: SARGE_THROW_Active_CD
                Value: 1
                ApplyTo: Me
                Frames: 300
      - Templates:
          - TACTICS.SARGES_WALK
        Priority: 3500
        Actions:
          - Animation:
                Name: Sarge_Walk
          - SetVariable:
                Name: SARGE_THROW_Active_CD
