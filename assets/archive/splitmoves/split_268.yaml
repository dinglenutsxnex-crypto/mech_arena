                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "Sarge_Smashing_Active_Miss"
        Actions:
          - SetVariable:
                Name: SHADOW_POWER_WILL_NO_REACTION
                Value: 1
                ApplyTo: Me
                Frames: 1
          - RepulsionType:
                ApplyTo: Me
                State: 0
          - SetShader:
                ApplyTo: Enemy
                Name: power
                Toggle: Off
                Transition: 0.5
