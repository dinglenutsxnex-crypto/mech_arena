                Frames: 30
          - ShakeCamera:
                Frames: 55
                AmpX: 5
                AmpY: 15
                PeriodX: 5.7
                PeriodY: 6.3
      - Events:
          - IntervalStart:
                Player: Me
                Name: Sarge_Smashing_Start_Reverse
        Priority: 401
        Conditions:
          - GreaterEqual:
                Value1: "?Fight[].Round"
                Value2: "2"
          - LessEqual:
                Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                Value2: "155"
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "Sarge_Walk"
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentInterval"
                    Value2: "Sarge_Walk_End"
        Actions:
          - Animation:
                Name: Sarge_Smashing_Active_Miss
          - SetVariable:
                Name: SHADOW_POWER_WILL_NO_REACTION
                Value: 1
                ApplyTo: Me
      - Templates:
          - REACTION.HIT_TO_ENEMY
        Priority: 1101
        Conditions:
          - Equal:
                Value1: "?Hit[].Name"
                Value2: "Sarge_Smashing"
          - Greater:
                Value1: "?Player[Enemy].Health"
                Value2: "0"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Enemy, PERK_STEEL_FOOT_FALL].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Enemy, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?GetVariable[Enemy, CRITICAL].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Enemy, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Enemy, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Enemy, PERK_ROCK_NO_FALL].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Enemy, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "PHYSICS"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Enemy, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?Hit[].Name"
                        Value2: "Hit_No_Critical_Reaction"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Enemy, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Enemy, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
        Actions:
          - Animation:
                Name: Sarge_Smashing_Active_Reverse
        Events:
          - PostHit:
                Player: Enemy
      - Priority: 401
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
