                ApplyTo: Me
                Frames: 800
          - RepulsionType:
                ApplyTo: Me
                State: 1
          - SetVariable:
                Name: SHADOW_POWER_WILL_NO_REACTION
                Value: 1
                ApplyTo: Me
          - SetShader:
                ApplyTo: Enemy
                Name: power
                Toggle: On
                Transition: 1
        Tactics:
            MathWeight: 9999
            Conditions:
              - Not:
                  - Equal:
                        Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SARGE_THROW_Active_CD].Value"
                        Value2: "1"
              - GreaterEqual:
                    Value1: "?Fight[].Round"
                    Value2: "2"
      - Events:
          - PostHit:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                Value2: "1"
          - LessEqual:
                Value1: "?Player[Me].Health"
                Value2: "0"
        Actions:
          - RepulsionType:
                ApplyTo: Me
                State: 0
          - SetShader:
                ApplyTo: Enemy
                Name: power
                Toggle: Off
                Transition: 0.5
      - Events:
          - IntervalEnd:
                Player: Me
                Name: Sarge_Walk_End
        Conditions: 
        Actions:
          - SetVariable:
                Name: SHADOW_POWER_WILL_NO_REACTION
                Value: 0
                ApplyTo: Me
                Frames: 1
          - RepulsionType:
                ApplyTo: Me
                State: 0
          - SetShader:
                ApplyTo: Enemy
                Name: power
                Toggle: Off
                Transition: 0.5
      - Events:
          - PostHit:
                Player: Me
        Priority: -1000
        Conditions:
          - Equal:
                Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                Value2: "1"
        Actions:
          - PlaySound:
