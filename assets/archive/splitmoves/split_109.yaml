Root: 
TriggerSets:
  - Name: Shadow_Carapace
    Triggers:
      - Templates:
          - SHADOW_KEY.DOWN
          - STATE.SHADOW_FORM
          - TACTICS.SHADOW_ATTACK_CLOSE
          - TACTICS_BASE.SHADOW_MOVE
        Conditions:
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, Shadow_Carapace_CD].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "AnimationEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                        IgnoredByAI: 1
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Down(Down|Hold)]"
                        IgnoredByAI: 1
                  - Or:
                      - And:
                          - Equal:
                                Value1: "?Player[Me].KeyPress"
                                Value2: "?CLC_KeyPressConvert[Shadow(Down)]"
                                IgnoredByAI: 1
                          - Not:
                              - Equal:
                                    Value1: "?Player[Me].CurrentInterval"
                                    Value2: "Uninterrupt"
                      - And:
                          - Equal:
                                Value1: "?Player[Me].CurrentAnimation"
                                Value2: "LOW_STANCE"
                          - Equal:
                                Value1: "?Player[Me].CurrentInterval"
                                Value2: "Transitional"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Back]"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Back]"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, TUTORIAL].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "AnimationEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down(Down|Hold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Back(Down|Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down(Up|Unhold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "FOLLOWED_BY"
          - Equal:
                Value1: "?Player[Me].ShadowForm"
                Value2: "1"
        Actions:
          - Animation:
                Name: Shadow_Carapace
          - SetVariable:
                Name: Shadow_Carapace_CD
                Value: 1
                ApplyTo: Me
                Frames: 400
          - SetVariable:
                Name: SF_CD_ARMOR
                Value: 1
                ApplyTo: Me
                Frames: 400
          - ShowSFIcon:
                ApplyTo: Me
                Name: Shadow_Carapace_CD
                Frames: 400
                Equipment: Armor
        Priority: 300
        Events:
          - KeyPress:
                Player: Me
                Key: Shadow
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Down
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Down_Back
                States:
                  - Down
                  - Hold
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
          - AnimationEnd:
                Player: Me
        Tactics:
            MathWeight: 1800
            Conditions:
              - LessEqual:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                    Value2: "230"
              - Equal:
                    Value1: "?Player[Me].ShadowForm"
                    Value2: "1"
              - Not:
                  - Equal:
                        Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, CHEAT_ATTACKS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_ARMOR].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_WEAPON].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_HELM].Value"
                        Value2: "1"
              - Equal:
                    Value1: "?Player[Me].ShadowForm"
                    Value2: "1"
      - Events:
          - IntervalStart:
                Player: Me
                Name: Shadow_Carapace_Model_Creation
        Actions:
          - CustomEffect:
                Name: ShadowCarapace
                ApplyTo: Me
                AttachToBone: chest
                Shift:
                    X: 0
                    Y: 0
                    Z: 0
                Follow: 1
                PoolQuantity: 1
                AttachToLocal: 1
          - SetVariable:
                Name: SHADOW_ATTACKING_EDGE
                Value: 1
                ApplyTo: Me
          - CreateModel:
                PoolQuantity: 1
                ModelInfo:
                    AiMode: NoneMode
                    Alias: SHADOW_CARAPACE_ATTACKING_EDGE
                    Animation: 1
                    Attributes:
                        CriticalChance: 0
                    Skeleton: shd-shadow_carapace
                    Tags:
                      - SHADOW_CARAPACE_MODEL
                      - SHADOW_ATTACKING_EDGE
                      - DESTROYABLE
Animations:
  - "Animation": Shadow_Carapace
    "FileName": shadow_ability_armor_str_2_player.bin
    "Groups":
      - ATTACK
      - SHADOW_MOVE
      - SHADOW_MOVE_END
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": foot_l
        "Position":
            "Player": Me
            "Object": Pivot
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
    "Intervals":
      - "Name": Uninterrupt
        "End": 36
      - "Name": Blocking
        "Start": 37
      - "Name": Throwable
        "Start": 31
      - "Name": Shadow_Move_Successful
        "Start": 21
        "End": 21
      - "Name": Shadow_Carapace_Model_Creation
        "Start": 5
        "End": 5
    "Sounds":
      - "Common":
          - shadow_moves/carapace/shadow_spray
        "Frame": 1
...
