Root: 
TriggerSets:
  - Name: Shadow_Spear_Slash_Reaction
    Triggers:
      - Templates:
          - REACTION.HIT
        Priority: 1101
        Conditions:
          - Equal:
                Value1: "?Hit[].Name"
                Value2: "Hit_Shadow_Spear_Slash_Hit"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?GetVariable[Me, CRITICAL].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Me, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, PERK_ROCK_NO_FALL].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Me, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?Hit[].Name"
                        Value2: "Hit_No_Critical_Reaction"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
        Actions:
          - Animation:
                Name: Shadow_Spear_Slash_Passive
        Events:
          - PostHit:
                Player: Me
Animations:
  - "Animation": Shadow_Spear_Slash_Passive
    "FileName": s_spear_slash_passive.bin
    "FirstFrame": 5
    "EndFrame": 50
    "Groups":
      - SHADOW_MOVE_PASSIVE
      - FALL
      - FALL_CRITICAL_ON_FACE
      - FOLLOWED_BY
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": pelvis
        "Position":
            "Player": Me
            "Object": Pivot
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
    "Intervals":
      - "Name": Uninterrupt
      - "Name": Floorfall
        "Start": 40
        "End": 40
...
