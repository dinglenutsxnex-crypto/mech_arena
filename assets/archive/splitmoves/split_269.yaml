Root: 
TriggerSets:
  - Name: SARGE_THROW_Passive
    Triggers:
      - Templates:
          - REACTION.HIT
        Priority: 1101
        Conditions:
          - Equal:
                Value1: "?Hit[].Name"
                Value2: "Sarge_Smashing"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?GetVariable[Me, CRITICAL].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Me, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, PERK_ROCK_NO_FALL].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Me, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?Hit[].Name"
                        Value2: "Hit_No_Critical_Reaction"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Me, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
        Actions:
          - Animation:
                Name: Sarge_Throw_Passive_Start
        Events:
          - PostHit:
                Player: Me
      - Priority: 3012
        Events:
          - IntervalStart:
                Player: Enemy
                Name: Sarge_Passive_2_Start
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "Sarge_Throw_Passive_Start"
        Actions:
          - Animation:
                Name: Sarge_Throw_Passive_End
Animations:
  - "Animation": Sarge_Throw_Passive_Start
    "FileName": sarge_smashing_passive_start.bin
    "Groups":
      - THROW_FALL
      - SUPER_FALL
      - FALL
      - FOLLOWED_BY
      - SHADOW_MOVE
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": pelvis
        "Position":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
        "Shift":
            "X": -100
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
    "Intervals":
      - "Type": NoRepulsion
      - "Name": Uninterrupt
  - "Animation": Sarge_Throw_Passive_End
    "FileName": sarge_smashing_passive_end.bin
    "Groups":
      - THROW_FALL
      - SUPER_FALL
      - FALL_CRITICAL_ON_FACE
      - FOLLOWED_BY
      - SHADOW_MOVE
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": pelvis
        "Position":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
    "Intervals":
      - "Type": NoRepulsion
      - "Name": Uninterrupt
...
