Root: 
TriggerSets:
  - Name: Shadow_Spurt
    Triggers:
      - Templates:
          - SHADOW_KEY.DOWN
          - STATE.SHADOW_FORM
          - TACTICS.SHADOW_ATTACK
          - TACTICS_BASE.SHADOW_MOVE
        Conditions:
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, Shadow_Spurt_CD].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "AnimationEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                        IgnoredByAI: 1
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Down(Down|Hold)]"
                        IgnoredByAI: 1
                  - Or:
                      - And:
                          - Equal:
                                Value1: "?Player[Me].KeyPress"
                                Value2: "?CLC_KeyPressConvert[Shadow(Down)]"
                                IgnoredByAI: 1
                          - Not:
                              - Equal:
                                    Value1: "?Player[Me].CurrentInterval"
                                    Value2: "Uninterrupt"
                      - And:
                          - Equal:
                                Value1: "?Player[Me].CurrentAnimation"
                                Value2: "LOW_STANCE"
                          - Equal:
                                Value1: "?Player[Me].CurrentInterval"
                                Value2: "Transitional"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Back]"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Back]"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, TUTORIAL].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "AnimationEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down(Down|Hold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Back(Down|Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down(Up|Unhold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "FOLLOWED_BY"
          - Equal:
                Value1: "?Player[Me].ShadowForm"
                Value2: "1"
        Actions:
          - Animation:
                Name: Shadow_Spurt_Cast
        Priority: 300
        Events:
          - KeyPress:
                Player: Me
                Key: Shadow
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Down
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Down_Back
                States:
                  - Down
                  - Hold
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
          - AnimationEnd:
                Player: Me
        Tactics:
            MathWeight: 1800
            Conditions:
              - Equal:
                    Value1: "?Player[Me].ShadowForm"
                    Value2: "1"
              - Not:
                  - Equal:
                        Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, CHEAT_ATTACKS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_ARMOR].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_WEAPON].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_HELM].Value"
                        Value2: "1"
              - Equal:
                    Value1: "?Player[Me].ShadowForm"
                    Value2: "1"
      - Events:
          - AnimationEnd:
                Player: Me
                Name: Shadow_Spurt_Cast
        Actions:
          - SetVariable:
                ApplyTo: Me
                Name: SHADOW_SPURT
                Value: 1
                Frames: 400
          - SetVariable:
                Name: SF_CD_ARMOR
                Value: 1
                ApplyTo: Me
                Frames: 400
          - ShowSFIcon:
                ApplyTo: Me
                Name: Shadow_Spurt_CD
                Frames: 400
                Equipment: Armor
      - Events:
          - AnimationStart:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "ATTACK"
          - Equal:
                Value1: "?GetVariable[Me, SHADOW_SPURT].Value"
                Value2: "1"
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "SHADOW_MOVE"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "THROW"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "FOLLOWED_BY"
        Actions:
          - CustomEffect:
                Name: sf_dash_main
                ApplyTo: Me
                AttachToBone: pelvis
                Looped: 0
                Follow:
                    X: 1
                    Y: 0
                    Z: 0
                Shift:
                    X: 0
                    Y: 0
                    Z: 0
                PoolQuantity: 1
          - CustomEffect:
                Name: sf_dash_trail1
                ApplyTo: Me
                AttachToBone: pelvis
                Looped: 0
                Follow:
                    X: 1
                    Y: 0
                    Z: 0
                Shift:
                    X: 0
                    Y: 0
                    Z: 0
                PoolQuantity: 1
          - CustomEffect:
                Name: sf_dash_trail2
                ApplyTo: Me
                AttachToBone: weapon_l
                Looped: 0
                Follow:
                    X: 1
                    Y: 0
                    Z: 0
                Shift:
                    X: 0
                    Y: 0
                    Z: 0
                PoolQuantity: 1
          - CustomEffect:
                Name: sf_dash_trail2
                ApplyTo: Me
                AttachToBone: weapon_r
                Looped: 0
                Follow:
                    X: 1
                    Y: 0
                    Z: 0
                Shift:
                    X: 0
                    Y: 0
                    Z: 0
                PoolQuantity: 1
          - CustomEffect:
                Name: sf_dash_trail2
                ApplyTo: Me
                AttachToBone: foot_l
                Looped: 0
                Follow:
                    X: 1
                    Y: 0
                    Z: 0
                Shift:
                    X: 0
                    Y: 0
                    Z: 0
                PoolQuantity: 1
          - CustomEffect:
                Name: sf_dash_trail2
                ApplyTo: Me
                AttachToBone: foot_r
                Looped: 0
                Follow:
                    X: 1
                    Y: 0
                    Z: 0
                Shift:
                    X: 0
                    Y: 0
                    Z: 0
                PoolQuantity: 1
      - Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "ATTACK"
          - Equal:
                Value1: "?GetVariable[Me, SHADOW_SPURT].Value"
                Value2: "1"
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "SHADOW_MOVE"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "THROW"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "FOLLOWED_BY"
        Actions:
          - DestroyEffect:
                Name: sf_dash_main
                ApplyTo: Me
          - DestroyEffect:
                Name: sf_dash_trail1
                ApplyTo: Me
          - DestroyEffect:
                Name: sf_dash_trail2
                ApplyTo: Me
      - Events:
          - IntervalStart:
                Player: Me
                Name: Attack
        Conditions:
          - Equal:
                Value1: "?GetVariable[Me, SHADOW_SPURT].Value"
                Value2: "1"
          - LessEqual:
                Value1: "?Coordinate[?Player[Me],COM].X"
                Value2: "?Coordinate[?Player[Enemy],COM].X"
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "SHADOW_MOVE"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "THROW"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "FOLLOWED_BY"
        Actions:
          - Move:
                ApplyTo: Me
                Speed: 30
                Acceleration: -3
                Frames: 10
      - Events:
          - IntervalStart:
                Player: Me
                Name: Attack
        Conditions:
          - Equal:
                Value1: "?GetVariable[Me, SHADOW_SPURT].Value"
                Value2: "1"
          - Greater:
                Value1: "?Coordinate[?Player[Me],COM].X"
                Value2: "?Coordinate[?Player[Enemy],COM].X"
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "SHADOW_MOVE"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "THROW"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "FOLLOWED_BY"
        Actions:
          - Move:
                ApplyTo: Me
                Speed: -30
                Acceleration: 3
                Frames: 10
Animations:
  - "Animation": Shadow_Spurt_Cast
    "FileName": shadow_ability_armor_str_2_player.bin
    "Groups":
      - SHADOW_MOVE
      - SHADOW_MOVE_END
    "Align":
        "Rotation":
            "Y": 0
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": pelvis
        "Position":
            "Player": Me
            "Object": Pivot
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
    "Intervals":
      - "Name": Uninterrupt
      - "Name": Shadow_Move_Successful
        "Start": 25
        "End": 25
...
