Root: 
TriggerSets:
  - Name: PERK_BACKSTABBER
    Triggers:
      - Events:
          - AnimationStart:
                Player: Me
        Conditions:
          - Greater:
                Value1: "abs(?Coordinate[?Player[Me],Wall,Front].X - ?Coordinate[?Player[Me],COM].X) - abs(?Coordinate[?Player[Enemy],Wall,Front].X - ?Coordinate[?Player[Enemy],COM].X)"
                Value2: "0"
          - Equal:
                Value1: "abs(?Coordinate[?Player[Me],Wall,Front].X - ?Coordinate[?Player[Enemy],Wall,Front].X)"
                Value2: "0"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
        Actions:
          - SetVariable:
                Name: PERK_BACKSTABBER
                Value: 1
                ApplyTo: Me
                Frames: 180
          - ShowStatusIcon:
                ApplyTo: Me
                Name: ICON_PERK_BACKSTABBER
                BackgroundColor: "#2f4668"
                Icon: ICON_PERK_BACKSTABBER
                Frames: 180
                ShowExpiration: 1
                Stackable: 0
        Templates:
          - STATE.ALIVE
      - Events:
          - Hit:
                Player: Enemy
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "WEAPON"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Enemy, BLOCK].Value"
                    Value2: "1"
          - Equal:
                Value1: "?GetVariable[Me, PERK_BACKSTABBER].Value"
                Value2: "1"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
        Actions:
          - SetAttribute:
                Name: Factor_UnarmedDamage
                Value: "?GetPerkVariable[Me, 1017, AdditionDamage]"
                ApplyTo: Me
          - SetAttribute:
                Name: Factor_WeaponDamage
                Value: "?GetPerkVariable[Me, 1017, AdditionDamage]"
                ApplyTo: Me
          - SetVariable:
                Name: PERK_BACKSTABBER
                Value: 0
                ApplyTo: Me
                Frames: 1
          - ClearStatusIcon:
                ApplyTo: Me
                Name: ICON_PERK_BACKSTABBER
        Templates:
          - STATE.ALIVE
      - Priority: 9990
        Events:
          - Hit:
                Player: Enemy
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "WEAPON"
          - Equal:
                Value1: "?GetVariable[Enemy, BLOCK].Value"
                Value2: "1"
          - LessEqual:
                Value1: "?Random[1,100]"
                Value2: "?GetPerkVariable[Me, 1017, Chance]"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
        Actions:
          - ShakeCamera:
                Frames: 20
                AmpX: 3
                AmpY: 10
                PeriodX: 5.7
                PeriodY: 6.3
          - SetVariable:
                Name: BLOCK
                Value: 0
                ApplyTo: Enemy
                Frames: 1
        Templates:
          - STATE.ALIVE
...
