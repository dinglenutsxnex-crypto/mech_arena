          - TACTICS.ATTACK_CLOSE
          - TACTICS_BASE.ATTACK
        Actions:
          - Animation:
                Name: Fists_Punch_Strong
        Priority: 200
        Events:
          - KeyPress:
                Player: Me
                Key: Punch
                States:
                  - Up
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
        Conditions:
          - Not:
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Back(Down|Hold)]"
