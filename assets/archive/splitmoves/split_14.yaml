Root: 
TriggerSets:
  - Name: ATTACK__SUPER_Fists_Agile
    Triggers:
      - Templates:
          - ATTACK.SUPER_1
          - TACTICS.ATTACK_AFAR
          - TACTICS_BASE.ATTACK
        Actions:
          - Animation:
                Name: Fists_Punch_Superman
        Events:
          - KeyPress:
                Player: Me
                Key: Punch
                States:
                  - Up
          - KeyPress:
                Player: Me
                Key: Forward
                States:
                  - Down
          - KeyPress:
                Player: Me
                Key: Down_Forward
                States:
                  - Down
          - KeyPress:
                Player: Me
                Key: Up_Forward
                States:
                  - Down
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
        Priority: 220
        Conditions:
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, TUTORIAL_NO_SUPER].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "StageChange"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Punch(Up|UnHold)]"
                        IgnoredByAI: 1
                  - Or:
                      - And:
                          - Equal:
                                Value1: "?Player[Me].CurrentAnimation"
                                Value2: "STEP_FORWARD"
                      - And:
                          - Or:
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Forward]"
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Down_Forward]"
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Up_Forward]"
                          - Equal:
                                Value1: "?Player[Me].CurrentAnimation"
                                Value2: "STEP_BACK"
                      - And:
                          - Or:
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Forward]"
                                    IgnoredByAI: 1
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Down_Forward]"
                                    IgnoredByAI: 1
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Up_Forward]"
                                    IgnoredByAI: 1
                          - Not:
                              - Equal:
                                    Value1: "?Player[Me].CurrentInterval"
                                    Value2: "Uninterrupt"
              - And:
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Forward]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Forward]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Forward]"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Punch(Up|UnHold)]"
                  - Or:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "StageChange"
        Tactics:
            MathWeight: 600
            Conditions:
              - Greater:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                    Value2: "250"
              - Not:
                  - Equal:
                        Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, CHEAT_ATTACKS_DISABLED].Value"
                        Value2: "1"
              - LessEqual:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                    Value2: "370"
  - Name: ATTACK__HEAVY_Fists_Agile
