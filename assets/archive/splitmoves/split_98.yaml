Root: 
TriggerSets:
  - Name: Shadow_Hammers_Throw
    Triggers:
      - Templates:
          - SHADOW_KEY.FORWARD
          - STATE.SHADOW_FORM
          - TACTICS.SHADOW_ATTACK
          - TACTICS_BASE.SHADOW_MOVE
        Conditions:
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, Shadow_Hammers_Throw_CD].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "AnimationEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                        IgnoredByAI: 1
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STEP_FORWARD"
                            IgnoredByAI: 1
                      - And:
                          - Equal:
                                Value1: "?Player[Me].CurrentAnimation"
                                Value2: "STEP_BACK"
                                IgnoredByAI: 1
                          - Or:
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Forward]"
                                    IgnoredByAI: 1
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Down_Forward]"
                                    IgnoredByAI: 1
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Up_Forward]"
                                    IgnoredByAI: 1
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Forward]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Forward]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Forward]"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Forward]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Forward]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Forward]"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, TUTORIAL].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "AnimationEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Forward(Down|Hold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Forward(Down|Hold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Forward(Down|Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Forward(Up|Unhold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "FOLLOWED_BY"
          - Equal:
                Value1: "?Player[Me].ShadowForm"
                Value2: "1"
        Actions:
          - Animation:
                Name: Shadow_Hammers_Throw_Miss
          - SetVariable:
                Name: Shadow_Hammers_Throw_CD
                Value: 1
                ApplyTo: Me
                Frames: 400
          - SetVariable:
                Name: SF_CD_WEAPON
                Value: 1
                ApplyTo: Me
                Frames: 400
          - ShowSFIcon:
                ApplyTo: Me
                Name: Shadow_Hammers_Throw_CD
                Frames: 400
                Equipment: Weapon
        Events:
          - KeyPress:
                Player: Me
                Key: Shadow
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Forward
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Down_Forward
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Up_Forward
                States:
                  - Down
                  - Hold
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
          - AnimationEnd:
                Player: Me
        Priority: 300
        Tactics:
            MathWeight: 1800
            Conditions:
              - Equal:
                    Value1: "?Player[Me].ShadowForm"
                    Value2: "1"
              - Not:
                  - Equal:
                        Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, CHEAT_ATTACKS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_ARMOR].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_WEAPON].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_HELM].Value"
                        Value2: "1"
              - Equal:
                    Value1: "?Player[Me].ShadowForm"
                    Value2: "1"
      - Events:
          - IntervalStart:
                Player: Me
                Name: Shadow_Hammers_FX
        Actions:
          - CustomEffect:
                Name: hammers_hand
                ApplyTo: Me
                AttachToBone: pelvis
                Looped: 0
                Follow: 1
                Shift:
                    X: 50
                    Y: -38
                    Z: 0
                PoolQuantity: 1
      - Events:
          - IntervalStart:
                Player: Me
                Name: Shadow_Hammers_miss_hit_FX
        Actions:
          - CustomEffect:
                Name: hammers_fly
                ApplyTo: Me
                AttachToBone: w_hammer_01_l
                Looped: 0
                Follow: 1
                Shift:
                    X: 23
                    Y: 0
                    Z: 0
                PoolQuantity: 1
      - Events:
          - IntervalStart:
                Player: Me
                Name: Shadow_Hammers_FX_2
        Actions:
          - CustomEffect:
                Name: hammers_hand_2
                ApplyTo: Me
                AttachToBone: pelvis
                Looped: 0
                Follow: 1
                Shift:
                    X: -130
                    Y: -15
                    Z: 0
                PoolQuantity: 1
      - Events:
          - PostHit:
                Player: Me
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "Shadow_Hammers_Throw_Miss"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "Shadow_Hammers_Throw"
        Actions:
          - DestroyEffect:
                Player: Me
                Name: hammers_hand
          - DestroyEffect:
                Player: Me
                Name: hammers_hand_2
          - DestroyEffect:
                Player: Me
                Name: hammers_fly
          - DestroyEffect:
                Player: Me
                Name: hammers_fly_hit
      - Templates:
          - REACTION.HIT_TO_ENEMY
        Conditions:
          - Equal:
                Value1: "?Hit[].Name"
                Value2: "Hit_Shadow_Hammers_Throw_Start"
          - Equal:
                Value1: "?Player[Me].CurrentInterval"
                Value2: "Transitional"
          - Greater:
                Value1: "?Player[Enemy].Health"
                Value2: "0"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Enemy, PERK_STEEL_FOOT_FALL].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Enemy, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?GetVariable[Enemy, CRITICAL].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Enemy, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Enemy, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Enemy, PERK_ROCK_NO_FALL].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Enemy, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "PHYSICS"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Enemy, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?Hit[].Name"
                        Value2: "Hit_No_Critical_Reaction"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Enemy, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Enemy, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
        Actions:
          - Animation:
                Name: Shadow_Hammers_Throw
          - DestroyEffect:
                Player: Me
                Name: hammers_fly
          - CustomEffect:
                Name: hammers_fly_hit
                ApplyTo: Me
                AttachToBone: w_hammer_01_l
                Looped: 0
                Follow: 1
                Shift:
                    X: 20
                    Y: 0
                    Z: 0
                PoolQuantity: 1
        Priority: 450
        Events:
          - PostHit:
                Player: Enemy
