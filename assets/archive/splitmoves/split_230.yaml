Root: 
TriggerSets:
  - Name: ENCHANTMENT_REGENERATION_BODY
    Triggers:
      - Events:
          - PostHit:
                Player: Me
                Defense: BodyDefense
        Conditions:
          - LessEqual:
                Value1: "?Random[1,100]"
                Value2: "?GetPerkVariable[Me, 2006, Chance]"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, BLOCK].Value"
                    Value2: "1"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
        Actions:
          - ApplyStatus:
                ApplyTo: Me
                Name: ENCHANTMENT_REGENERATION_BODY
                Frames: "?GetPerkVariable[Me, 2006, Frames]"
                Type: ModHP
                HPPerFrame: "?GetPerkVariable[Me, 2006, RegenerationPower] * ?Hit[].Damage / ?GetPerkVariable[Me, 2006, Frames]"
          - ShowStatusIcon:
                ApplyTo: Me
                Name: ICON_ENCHANTMENT_REGENERATION
                Icon: ICON_ENCHANTMENT_REGENERATION
                BackgroundColor: "#2f4668"
                ShowExpiration: 1
                Frames: "?GetPerkVariable[Me, 2006, Frames]"
        Templates:
          - STATE.ALIVE
...
