Root: 
TriggerSets:
  - Name: PERK_VENGEFUL_TIGER
    Triggers:
      - Priority: 9997
        Events:
          - PostHit:
                Player: Me
                Defense: HeadDefense
        Conditions:
          - Equal:
                Value1: "?GetVariable[Me, SHOCKED].Value"
                Value2: "1"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
        Actions:
          - ShowStatusIcon:
                ApplyTo: Me
                Name: ICON_PERK_VENGEFUL_TIGER
                BackgroundColor: "#2f4668"
                Icon: ICON_PERK_VENGEFUL_TIGER
                ShowExpiration: 0
                Stackable: 0
        Templates:
          - STATE.ALIVE
      - Priority: 9997
        Events:
          - PostHit:
                Player: Enemy
                Defense: HeadDefense
        Conditions:
          - Equal:
                Value1: "?GetVariable[Me, SHOCKED].Value"
                Value2: "1"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Enemy, BLOCK].Value"
                    Value2: "1"
              - Equal:
                    Value1: "?GetVariable[Enemy, SHOCKED].Value"
                    Value2: "1"
              - Equal:
                    Value1: "?GetVariable[Enemy, PERK_IRON_GRIP].Value"
                    Value2: "1"
          - LessEqual:
                Value1: "?Random[1,100]"
                Value2: "?GetPerkVariable[Me, 1021, ShockChanceValue]"
          - Not:
              - LessEqual:
                    Value1: "?Player[Me].Health"
                    Value2: "0"
        Actions:
          - Disarm:
                ApplyTo: Enemy
          - SetVariable:
                Name: SHOCKED
                Value: 1
                ApplyTo: Enemy
          - SetVariable:
                Name: SHOCK
                Value: 1
                ApplyTo: Enemy
                Frames: 1
          - ClearStatusIcon:
                ApplyTo: Me
                Name: ICON_PERK_VENGEFUL_TIGER
        Templates:
          - STATE.ALIVE
...
