    Triggers:
      - Templates:
          - ATTACK.BASIC
          - TACTICS.ATTACK_MIDRANGE
          - TACTICS_BASE.ATTACK
        Actions:
          - Animation:
                Name: Dual_Swords_Slash
        Priority: 200
        Events:
          - KeyPress:
                Player: Me
                Key: Punch
                States:
                  - Up
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
        Conditions:
          - Not:
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Back(Down|Hold)]"
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Forward(Down|Hold)]"
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Up(Down|Hold)]"
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Down(Down|Hold)]"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "StageChange"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Punch(Down|Up)]"
                        IgnoredByAI: 1
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Punch(Up|Unhold)]"
