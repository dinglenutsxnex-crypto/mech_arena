    Triggers:
      - Templates:
          - ATTACK.BASIC
          - TACTICS.ATTACK_MIDRANGE
          - TACTICS_BASE.ATTACK
        Actions:
          - Animation:
                Name: Twohanded_Sword_Slash
        Priority: 200
        Events:
          - KeyPress:
                Player: Me
                Key: Punch
                States:
                  - Up
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
        Conditions:
          - Not:
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Back(Down|Hold)]"
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Forward(Down|Hold)]"
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Up(Down|Hold)]"
              - Equal:
                    Value1: "?Player[Me].KeyPress"
                    Value2: "?CLC_KeyPressConvert[Down(Down|Hold)]"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "StageChange"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Punch(Down|Up)]"
                        IgnoredByAI: 1
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Punch(Up|Unhold)]"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Punch(Up|Unhold)]"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, TUTORIAL].Value"
                            Value2: "1"
        Tactics:
            MathWeight: 600
            Conditions:
              - Greater:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                    Value2: "160"
              - LessEqual:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                    Value2: "300"
              - Not:
