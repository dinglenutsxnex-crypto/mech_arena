                Player: Me
                Key: Kick
                States:
                  - Down
        Priority: 230
        Conditions:
          - Equal:
                Value1: "?Player[Me].CurrentAnimation"
                Value2: "KICK_SUPER_1"
                IgnoredByAI: 1
          - Equal:
                Value1: "?Player[Me].CurrentInterval"
                Value2: "Transitional"
                IgnoredByAI: 1
        Tactics:
            MathWeight: 1800
            Conditions:
              - Or:
                  - Equal:
                        Value1: "?Player[Me].CurrentAnimation"
                        Value2: "ATTACK"
                  - Equal:
                        Value1: "?Player[Enemy].CurrentAnimation"
                        Value2: "HIT"
              - Not:
                  - Equal:
                        Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, CHEAT_ATTACKS_DISABLED].Value"
                        Value2: "1"
              - LessEqual:
                    Value1: "abs(?Coordinate[?Player[Me],COM].X - ?Coordinate[?Player[Enemy],COM].X)"
                    Value2: "370"
