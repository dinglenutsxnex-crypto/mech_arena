Root: 
TriggerSets:
  - Name: Inv_1_In_M_Mirrored
    Triggers:
      - Templates:
          - INVENTORY.IN
        Actions:
          - Animation:
                Name: Inv_1_In_M_Mirrored
          - SetVariable:
                Name: TryOn_Crutch
                Value: "1"
                ApplyTo: Enemy
        Priority: 20001
        Events:
          - AnimationEnd:
                Player: Me
          - ModulePreEnter:
                Name: Inventory
          - ModulePreEnter:
                Name: Shop
          - ModulePreEnter:
                Name: CharacterCreation
          - ModulePreEnter:
                Name: BoosterpacksScreen
          - ModuleEnter:
                Name: Inventory
          - ModuleEnter:
                Name: Shop
          - ModuleEnter:
                Name: CharacterCreation
          - ModuleEnter:
                Name: BoosterpacksScreen
        Conditions:
          - Not:
              - Equal:
                    Value1: "?GetVariable[Enemy, TryOn_Crutch].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Greater:
                        Value1: "?Coordinate[?Player[Me],COM].X"
                        Value2: "?Coordinate[?Player[Me],Wall,Back].X"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].InMirrorPose"
                            Value2: "1"
              - And:
                  - Less:
                        Value1: "?Coordinate[?Player[Me],COM].X"
                        Value2: "?Coordinate[?Player[Me],Wall,Back].X"
                  - Equal:
                        Value1: "?Player[Me].InMirrorPose"
                        Value2: "1"
          - Or:
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "AnimationEnd"
                  - Or:
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "Inventory"
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "Shop"
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "CharacterCreation"
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "BoosterpacksScreen"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_INVENTORY"
              - And:
                  - Or:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "ModulePreEnter"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "ModuleEnter"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_INVENTORY"
      - Templates:
          - INVENTORY.IN_REVERSE
        Actions:
          - Animation:
                Name: Inv_1_In_Back_M_Mirrored
          - SetVariable:
                Name: TryOn_Crutch
                Value: "1"
                ApplyTo: Enemy
        Priority: 20001
        Events:
          - AnimationEnd:
                Player: Me
          - ModulePreEnter:
                Name: Inventory
          - ModulePreEnter:
                Name: Shop
          - ModulePreEnter:
                Name: CharacterCreation
          - ModulePreEnter:
                Name: BoosterpacksScreen
          - ModuleEnter:
                Name: Inventory
          - ModuleEnter:
                Name: Shop
          - ModuleEnter:
                Name: CharacterCreation
          - ModuleEnter:
                Name: BoosterpacksScreen
        Conditions:
          - Not:
              - Equal:
                    Value1: "?GetVariable[Enemy, TryOn_Crutch].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Greater:
                        Value1: "?Coordinate[?Player[Me],COM].X"
                        Value2: "?Coordinate[?Player[Me],Wall,Back].X"
                  - Equal:
                        Value1: "?Player[Me].InMirrorPose"
                        Value2: "1"
              - And:
                  - Less:
                        Value1: "?Coordinate[?Player[Me],COM].X"
                        Value2: "?Coordinate[?Player[Me],Wall,Back].X"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].InMirrorPose"
                            Value2: "1"
          - Or:
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "AnimationEnd"
                  - Or:
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "Inventory"
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "Shop"
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "CharacterCreation"
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "BoosterpacksScreen"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_INVENTORY"
              - And:
                  - Or:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "ModulePreEnter"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "ModuleEnter"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].CurrentInterval"
                            Value2: "Uninterrupt"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STANCE_INVENTORY"
  - Name: Inv_1_Idle_Mirrored
    Triggers:
      - Templates:
          - INVENTORY.IDLE
        Actions:
          - Animation:
                Name: Inv_1_Idle_Mirrored
        Priority: 20000
        Events:
          - AnimationEnd:
                Player: Me
        Conditions:
          - Not:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_INVENTORY_OUT"
          - Or:
              - Equal:
                    Value1: "?Module[].CurrentModule"
                    Value2: "Inventory"
              - Equal:
                    Value1: "?Module[].CurrentModule"
                    Value2: "Shop"
              - Equal:
                    Value1: "?Module[].CurrentModule"
                    Value2: "CharacterCreation"
              - Equal:
                    Value1: "?Module[].CurrentModule"
                    Value2: "PerkScreen"
              - Equal:
                    Value1: "?Module[].CurrentModule"
                    Value2: "BoosterpacksScreen"
  - Name: Inv_1_Out_Mirrored
    Triggers:
      - Templates:
          - INVENTORY.OUT
        Actions:
          - Animation:
                Name: Inv_1_Out_Mirrored
          - SetVariable:
                Name: TryOn_Crutch
                Value: "0"
                ApplyTo: Enemy
                Frames: 1
        Priority: 20000
        Events:
          - ModulePreEnter:
                Name: DojoInterface
          - ModuleEnter:
                Name: DojoInterface
          - AnimationEnd:
                Player: Me
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_INVENTORY_IN"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "STANCE_INVENTORY_IDLE"
              - Equal:
                    Value1: "?Player[Me].CurrentAnimation"
                    Value2: "TRY_ON"
          - Or:
              - Equal:
                    Value1: "?Trigger[].Event"
                    Value2: "ModulePreEnter"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "AnimationEnd"
                  - Not:
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "Inventory"
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "Shop"
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "CharacterCreation"
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "PerkScreen"
                      - Equal:
                            Value1: "?Module[].CurrentModule"
                            Value2: "BoosterpacksScreen"
  - Name: Inv_1_Helm_01_Mirrored
    Triggers:
      - Templates:
          - INVENTORY.TRY_ON_HELMET
        Actions:
          - Animation:
                Name: Inv_1_Helm_01_Mirrored
        Priority: 20010
        Events:
          - Equip:
                Player: Me
          - TryOn:
                Player: Me
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Module[].SelectedItemType"
                    Value2: "Helmet"
  - Name: Inv_1_ARMOR_Common_Mirrored
    Triggers:
      - Templates:
          - INVENTORY.TRY_ON_ARMOR
        Actions:
          - AnimationRandom:
                Names:
                  - Inv_1_Armor_01_M_Mirrored
                  - Inv_1_Armor_02_M_Mirrored
                  - Inv_1_Armor_04_M_Mirrored
        Priority: 20010
        Events:
          - Equip:
                Player: Me
          - TryOn:
                Player: Me
        Conditions:
          - Or:
              - Equal:
                    Value1: "?Module[].SelectedItemType"
