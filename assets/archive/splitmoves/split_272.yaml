  - Name: Inv_1_Weapon_Common_Mirrored
    Triggers:
      - Templates:
          - INVENTORY.TRY_ON_WEAPON
        Actions:
          - Animation:
                Name: Inv_1_Dual_Swords_01_Mirrored
