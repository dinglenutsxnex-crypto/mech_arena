Root: 
TriggerSets:
  - Name: Shadow_Spear_Throw
    Triggers:
      - Templates:
          - SHADOW_KEY.FORWARD
          - STATE.SHADOW_FORM
          - TACTICS.SHADOW_ATTACK
          - TACTICS_BASE.SHADOW_MOVE
        Conditions:
          - Not:
              - Equal:
                    Value1: "?GetVariable[Me, Shadow_Spear_Throw_CD].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "AnimationEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "IntervalEnd"
                      - Equal:
                            Value1: "?Trigger[].Event"
                            Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                        IgnoredByAI: 1
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "STEP_FORWARD"
                            IgnoredByAI: 1
                      - And:
                          - Equal:
                                Value1: "?Player[Me].CurrentAnimation"
                                Value2: "STEP_BACK"
                                IgnoredByAI: 1
                          - Or:
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Forward]"
                                    IgnoredByAI: 1
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Down_Forward]"
                                    IgnoredByAI: 1
                              - Equal:
                                    Value1: "?Player[Me].KeyPress"
                                    Value2: "?CLC_KeyPressConvert[Up_Forward]"
                                    IgnoredByAI: 1
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "IntervalEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Forward]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Forward]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Forward]"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "StageChange"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Forward]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Forward]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Forward]"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Me, TUTORIAL].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?Trigger[].Event"
                        Value2: "AnimationEnd"
                  - Equal:
                        Value1: "?Player[Me].KeyPress"
                        Value2: "?CLC_KeyPressConvert[Shadow]"
                  - Or:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Forward(Down|Hold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Down_Forward(Down|Hold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Up_Forward(Down|Hold)]"
                  - Not:
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Forward(Up|Unhold)]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Punch]"
                      - Equal:
                            Value1: "?Player[Me].KeyPress"
                            Value2: "?CLC_KeyPressConvert[Kick]"
                      - Equal:
                            Value1: "?Player[Me].CurrentAnimation"
                            Value2: "FOLLOWED_BY"
          - Equal:
                Value1: "?Player[Me].ShadowForm"
                Value2: "1"
        Actions:
          - Animation:
                Name: Shadow_Spear_Throw
          - SetVariable:
                Name: Shadow_Spear_Throw_CD
                Value: 1
                ApplyTo: Me
                Frames: 400
          - SetVariable:
                Name: SF_CD_WEAPON
                Value: 1
                ApplyTo: Me
                Frames: 400
          - ShowSFIcon:
                ApplyTo: Me
                Name: Shadow_Spear_Throw_CD
                Frames: 400
                Equipment: Weapon
        Events:
          - KeyPress:
                Player: Me
                Key: Shadow
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Forward
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Down_Forward
                States:
                  - Down
                  - Hold
          - KeyPress:
                Player: Me
                Key: Up_Forward
                States:
                  - Down
                  - Hold
          - IntervalEnd:
                Player: Me
                Name: Uninterrupt
          - StageChange:
                Stage: RoundFightStart
          - AnimationEnd:
                Player: Me
        Priority: 300
        Tactics:
            MathWeight: 1800
            Conditions:
              - Equal:
                    Value1: "?Player[Me].ShadowForm"
                    Value2: "1"
              - Not:
                  - Equal:
                        Value1: "?GetVariable[Me, TUTORIAL_CONTROLS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, CHEAT_ATTACKS_DISABLED].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_ARMOR].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_WEAPON].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Me, SF_CD_HELM].Value"
                        Value2: "1"
              - Equal:
                    Value1: "?Player[Me].ShadowForm"
                    Value2: "1"
      - Events:
          - IntervalStart:
                Player: Me
                Name: Shadow_Spear_Throw_Model_Creation
        Actions:
          - SetVariable:
                Name: SHADOW_ATTACKING_EDGE
                Value: 1
                ApplyTo: Me
          - PlaySound:
                Sounds:
                  - shadow_moves/2h_slash/shadow_slash_wave_2_short
          - CreateModel:
                PoolQuantity: 1
                ModelInfo:
                    AiMode: NoneMode
                    Alias: SHADOW_SPEAR_THROW_ATTACKING_EDGE
                    Animation: 1
                    Attributes:
                        CriticalChance: 0
                    Skeleton: shd-shadow_spear_throw
                    Tags:
                      - SHADOW_SPEAR_THROW_MODEL
                      - SHADOW_ATTACKING_EDGE
                      - DESTROYABLE
Animations:
  - "Animation": Shadow_Spear_Throw
    "FileName": s_spear_throw.bin
    "Groups":
      - ATTACK
      - SHADOW_MOVE
      - SHADOW_MOVE_END
    "WeaponSwitchFrames":
      - "Name": Main
        "Frame": 1
    "Align":
        "Rotation":
            "Y": 6
        "Axis":
          - X
        "Pivot":
            "Object": Nodes
            "Part": foot_l
        "Position":
            "Player": Me
            "Object": Pivot
    "SetDirection":
        "From":
            "Player": Me
            "Object": Nodes
            "Part": pelvis
        "To":
            "Player": Enemy
            "Object": Nodes
            "Part": pelvis
    "Intervals":
      - "Name": Uninterrupt
        "End": 70
      - "Name": Shadow_Move_Successful
        "Start": 18
        "End": 18
      - "Name": Shadow_Spear_Throw_Model_Creation
        "Start": 18
        "End": 18
      - "Name": Throwable
        "Start": 65
      - "Name": Blocking
        "Start": 71
    "Sounds":
      - "Gender":
            "Male":
              - voice/attack/heavy/m/m_heavy_attack_1
              - voice/attack/heavy/m/m_heavy_attack_4
              - voice/attack/heavy/m/m_heavy_attack_5
              - voice/attack/heavy/m/m_heavy_attack_6
              - voice/attack/heavy/m/m_heavy_attack_7
            "Female":
              - voice/attack/heavy/f/f_heavy_attack_1
              - voice/attack/heavy/f/f_heavy_attack_2
              - voice/attack/heavy/f/f_heavy_attack_3
              - voice/attack/heavy/f/f_heavy_attack_4
              - voice/attack/heavy/f/f_heavy_attack_5
        "Frame": 16
...
