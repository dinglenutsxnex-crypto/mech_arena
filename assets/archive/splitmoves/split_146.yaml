  - Name: ATTACK_SUPER_1_3_Axes_Active
    Triggers:
      - Templates:
          - REACTION.HIT_TO_ENEMY
        Conditions:
          - Equal:
                Value1: "?Hit[].Name"
                Value2: "Hit_Axes_Super_1"
          - Greater:
                Value1: "?Player[Enemy].Health"
                Value2: "0"
          - Not:
              - Equal:
                    Value1: "?GetVariable[Enemy, PERK_STEEL_FOOT_FALL].Value"
                    Value2: "1"
          - Or:
              - And:
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Enemy, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?GetVariable[Enemy, CRITICAL].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "PHYSICS"
                      - Equal:
                            Value1: "?GetVariable[Enemy, SHADOW_POWER_WILL_NO_REACTION].Value"
                            Value2: "1"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Enemy, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?GetVariable[Enemy, PERK_ROCK_NO_FALL].Value"
                        Value2: "1"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Enemy, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentInterval"
                            Value2: "Unstable"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "PHYSICS"
              - And:
                  - Equal:
                        Value1: "?GetVariable[Enemy, CRITICAL].Value"
                        Value2: "1"
                  - Equal:
                        Value1: "?Hit[].Name"
                        Value2: "Hit_No_Critical_Reaction"
                  - Not:
                      - Equal:
                            Value1: "?GetVariable[Enemy, BLOCK].Value"
                            Value2: "1"
                      - Equal:
                            Value1: "?Player[Enemy].CurrentAnimation"
                            Value2: "THROW_FALL"
                      - Equal:
