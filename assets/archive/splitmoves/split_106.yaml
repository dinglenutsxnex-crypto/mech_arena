        "Start": 59
    "Sounds":
      - "Gender":
            "Male":
              - voice/attack/heavy/m/m_heavy_attack_1
              - voice/attack/heavy/m/m_heavy_attack_4
              - voice/attack/heavy/m/m_heavy_attack_5
              - voice/attack/heavy/m/m_heavy_attack_6
              - voice/attack/heavy/m/m_heavy_attack_7
            "Female":
              - voice/attack/heavy/f/f_heavy_attack_1
              - voice/attack/heavy/f/f_heavy_attack_2
              - voice/attack/heavy/f/f_heavy_attack_3
              - voice/attack/heavy/f/f_heavy_attack_4
              - voice/attack/heavy/f/f_heavy_attack_5
        "Frame": 8
